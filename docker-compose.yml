services:
  db:
    image: postgres:18
    container_name: online_cinema_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  test_db:
    image: postgres:18
    container_name: online_cinema_test_db
    restart: always
    environment:
      POSTGRES_DB: online_cinema_test
      POSTGRES_USER: cinema_test_user
      POSTGRES_PASSWORD: cinema_test_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: online_cinema_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: online_cinema_web
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  celery_worker:
    build: .
    container_name: online_cinema_celery_worker
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    command: celery -A src.tasks.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/app

  celery_beat:
    build: .
    container_name: online_cinema_celery_beat
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    command: celery -A src.tasks.celery_app.celery_app beat --loglevel=info
    volumes:
      - .:/app

  mailhog:
    image: mailhog/mailhog
    container_name: online_cinema_mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio
    container_name: online_cinema_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  postgres_test_data: